name: TangranTech
version: 2.1.4-standalone
main: com.tangran.tangrantech.TangranTechPlugin
api-version: '1.21'
author: Tang_ran
description: 糖然科技 —— 独立 Slimefun 附属（由 RSC 脚本版重构为原生 Java 加载）
depend: [Slimefun]
# LuckPerms：权限层走它的 API（管理节点 tangrantech.admin.* 与玩法资格节点），
# 缺失时自动回落 Bukkit 原生 hasPermission / isOp（功能不受影响）。
# LogiTech：堆叠机对接（compat/LogiTechStackBridge）只在它自己的「配方供应器」扫描结束后
# 登记一次（见该类的 scheduleRegister）；列进 softdepend 保证它先 enable、先排期那次扫描。
# 缺失时该对接整体跳过，本插件功能不受影响。
# 列进 softdepend 保证它们先启动（权限探测是「失败一次就记住不可用」）。
softdepend: [LuckPerms, LogiTech]

commands:
  tr:
    description: 糖然科技管理指令（RSC 玩家数据导入 / 存储维护）
    usage: |
      /tr import [--apply] [--source <目录>] [--only <命名空间,...>] [--overwrite]
      默认只预览（dry-run），加 --apply 才真正写库
    aliases: [tangrantech]
